name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore MultiGuide.sln
      - run: dotnet build MultiGuide.sln -c Release --no-restore -warnaserror
      - run: dotnet format MultiGuide.sln --verify-no-changes --no-restore
      - name: Test + coverage
        run: dotnet test MultiGuide.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
      - name: Quét lỗ hổng gói NuGet
        run: |
          dotnet list MultiGuide.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eq "High|Critical" vuln.txt; then echo "::error::Có lỗ hổng mức High/Critical"; exit 1; fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t multiguide:ci .