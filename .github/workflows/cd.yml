name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy hook call."
            exit 0
          fi
          echo "Calling Render Deploy Hook..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "::error::Deploy hook failed with status $http_code"
            exit 1
          fi
          echo "Deploy hook triggered successfully."

      - name: Smoke test /health
        run: |
          SERVICE_URL="${{ secrets.RENDER_SERVICE_URL }}"
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL="https://multiguide-1person.onrender.com"
          fi

          echo "Starting smoke test on $SERVICE_URL/health (retrying up to 3 minutes)..."
          start_time=$(date +%s)
          timeout=180

          while true; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))
            if [ $elapsed -ge $timeout ]; then
              echo "::error::Smoke test timed out after ${timeout}s"
              exit 1
            fi

            http_code=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || true)
            if [ "$http_code" -eq 200 ]; then
              echo "Smoke test passed! /health returned 200 OK after ${elapsed}s."
              break
            fi

            echo "Health check returned status $http_code. Waiting 10s before retry (${elapsed}s elapsed)..."
            sleep 10
          done

      - name: Smoke test /health/ready
        run: |
          SERVICE_URL="${{ secrets.RENDER_SERVICE_URL }}"
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL="https://multiguide-1person.onrender.com"
          fi

          echo "Checking $SERVICE_URL/health/ready..."
          response=$(curl -s "$SERVICE_URL/health/ready" || true)
          echo "Readiness response: $response"
